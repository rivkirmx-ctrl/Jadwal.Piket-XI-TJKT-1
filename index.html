<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="whJjgBQxTg1xyPobHsOrGNJFFK4nzUID6cEdgIfa3u4" />
  <title>Jadwal Piket Kebersihan</title>
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-main: #0a0c10;
      --bg-card: rgba(22, 27, 34, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .title-group h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }

    .admin-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .badge-status {
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border-radius: 50px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .badge-status.is-admin {
      background: rgba(0, 242, 254, 0.1);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--text-muted);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000;
      border: none;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-primary:hover {
      opacity: 0.9;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #000;
    }

    /* Layout Horizontal Menyamping */
    .schedule-container {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 1.5rem;
      -webkit-overflow-scrolling: touch;
    }

    .schedule-grid {
      display: flex;
      gap: 1.25rem;
      min-width: max-content;
    }

    .day-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
      width: 270px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .day-card:hover {
      border-color: rgba(0, 242, 254, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transform: translateY(-4px);
    }

    .day-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .day-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .slot-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .slot-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
    }

    .slot-num {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(0, 242, 254, 0.1);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .slot-name {
      font-size: 0.9rem;
      color: var(--text-main);
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
    }

    /* Style saat Mode Admin Aktif */
    body.is-admin-mode .slot-name {
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed var(--accent-cyan);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      color: #fff;
    }

    body.is-admin-mode .slot-name:focus {
      border-style: solid;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* Custom Scrollbar */
    .schedule-container::-webkit-scrollbar {
      height: 8px;
    }

    .schedule-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
    }

    .schedule-container::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 10px;
    }

    .scroll-hint {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }

    .admin-note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: none;
    }

    body.is-admin-mode .admin-note {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <h1><i data-lucide="sparkles"></i> JADWAL PIKET</h1>
        <p>Senin - Jumat (6 Petugas per hari)</p>
      </div>

      <div class="admin-controls">
        <span id="adminBadge" class="badge-status">
          <i data-lucide="eye"></i> Mode Viewer
        </span>
        <button id="adminBtn" class="btn" onclick="toggleAdmin()">
          <i data-lucide="lock"></i> Login Admin
        </button>
      </div>
    </header>

    <div class="scroll-hint">
      <i data-lucide="arrow-right-left" style="width: 14px;"></i>
      <span>Geser ke samping untuk melihat seluruh hari</span>
    </div>

    <!-- Container Scroll Horizontal -->
    <div class="schedule-container">
      <div class="schedule-grid" id="scheduleGrid">
        <!-- Hari akan di-render otomatis lewat JS -->
      </div>
    </div>

    <p class="admin-note">
      <i data-lucide="info"></i> Mode Admin Aktif: Klik pada kolom nama untuk mengubahnya. Perubahan tersimpan otomatis.
    </p>
  </div>

  <script>
    // Password Admin Diperbarui
    const ADMIN_PASSWORD = "10-09-2009";

    // Data default jadwal piket
    const defaultData = {
      "Senin": ["Nama 1", "Nama 2", "Nama 3", "Nama 4", "Nama 5", "Nama 6"],
      "Selasa": ["Nama 1", "Nama 2", "Nama 3", "Nama 4", "Nama 5", "Nama 6"],
      "Rabu": ["Nama 1", "Nama 2", "Nama 3", "Nama 4", "Nama 5", "Nama 6"],
      "Kamis": ["Nama 1", "Nama 2", "Nama 3", "Nama 4", "Nama 5", "Nama 6"],
      "Jumat": ["Nama 1", "Nama 2", "Nama 3", "Nama 4", "Nama 5", "Nama 6"]
    };

    let isAdmin = false;
    let scheduleData = JSON.parse(localStorage.getItem('piketData')) || defaultData;

    // Render tampilan jadwal
    function renderSchedule() {
      const grid = document.getElementById('scheduleGrid');
      grid.innerHTML = '';

      Object.keys(scheduleData).forEach(day => {
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';

        let slotsHTML = '';
        scheduleData[day].forEach((person, index) => {
          slotsHTML += `
            <li class="slot-item">
              <span class="slot-num">${index + 1}</span>
              <input 
                type="text" 
                class="slot-name" 
                value="${person}" 
                ${!isAdmin ? 'readonly' : ''} 
                onchange="updateName('${day}', ${index}, this.value)"
                placeholder="Isi nama..."
              />
            </li>
          `;
        });

        dayCard.innerHTML = `
          <div class="day-header">
            <h2>${day}</h2>
            <i data-lucide="calendar" style="width: 18px; color: var(--accent-cyan);"></i>
          </div>
          <ul class="slot-list">
            ${slotsHTML}
          </ul>
        `;

        grid.appendChild(dayCard);
      });

      lucide.createIcons();
    }

    // Toggle Login Admin
    function toggleAdmin() {
      if (!isAdmin) {
        const inputPass = prompt("Masukkan Password Admin:");
        if (inputPass === ADMIN_PASSWORD) {
          isAdmin = true;
          document.body.classList.add('is-admin-mode');
          updateAdminUI();
          renderSchedule();
        } else if (inputPass !== null) {
          alert("Password salah!");
        }
      } else {
        isAdmin = false;
        document.body.classList.remove('is-admin-mode');
        updateAdminUI();
        renderSchedule();
      }
    }

    function updateAdminUI() {
      const btn = document.getElementById('adminBtn');
      const badge = document.getElementById('adminBadge');

      if (isAdmin) {
        btn.className = "btn btn-primary";
        btn.innerHTML = `<i data-lucide="log-out"></i> Keluar Admin`;
        badge.className = "badge-status is-admin";
        badge.innerHTML = `<i data-lucide="shield-check"></i> Mode Admin`;
      } else {
        btn.className = "btn";
        btn.innerHTML = `<i data-lucide="lock"></i> Login Admin`;
        badge.className = "badge-status";
        badge.innerHTML = `<i data-lucide="eye"></i> Mode Viewer`;
      }
      lucide.createIcons();
    }

    // Simpan data
    function updateName(day, index, value) {
      scheduleData[day][index] = value;
      localStorage.setItem('piketData', JSON.stringify(scheduleData));
    }

    // Jalankan pertama kali
    renderSchedule();
  </script>
</body>
</html>
